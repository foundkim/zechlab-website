<div
  class="w-full max-w-[800px] max-h-[300px] flex bg-white rounded-2xl shadow-md hover:shadow-lg transition-transform duration-300 overflow-hidden font-['Zilla_Slab']"
>
  <!-- Image -->
  <div class="w-1/3">
    <img
      [src]="announcement.image"
      alt="Image de la publication"
      class="w-full h-full object-cover rounded-l-xl"
    />
  </div>

  <!-- Contenu -->
  <div class="w-2/3 p-6 flex flex-col justify-start items-start text-left">
    <h6 class="text-sm text-blue-600 font-bold uppercase mb-2 tracking-wide">
      {{ announcement.category }}
    </h6>
    <h4 class="text-xl font-extrabold text-gray-900 leading-snug mb-4">
      {{ announcement.title }}
    </h4>
    <p class="text-gray-700 text-sm mb-5 leading-relaxed">
      {{ announcement.description }}
    </p>
    <a
      [href]="announcement.link"
      target="_blank"
      class="inline-block bg-[#f1b51c] text-[#0b2949] px-5 py-2 rounded-md text-sm font-bold hover:bg-[#da1a1a] hover:text-white transition"
    >
      {{ announcement.cta }}
    </a>
  </div>
</div>
