<div class="flex flex-row gap-4 p-8 bg-white rounded-lg shadow-lg">
  <div class="w-1/2 flex flex-col gap-4">
    <!-- Contenu texte -->
    <div>
      <h2 class="text-2xl font-bold text-[#98d4bc] text-teal-700">
        {{ title }}
      </h2>

      <div class="text-gray-800 leading-relaxed">
        <p *ngFor="let line of addressLines">{{ line }}</p>
      </div>

      <p class="mt-2 text-gray-900 font-semibold">Tel: {{ phone }}</p>

      <div class="flex justify-center gap-4 mt-6 flex-wrap">
        <a
          *ngFor="let action of actions"
          [href]="action.link"
          target="_blank"
          class="flex items-center gap-2 px-6 py-3 border border-gray-300 rounded-full text-teal-700 font-semibold hover:bg-gray-100 transition"
        >
          <mat-icon>{{ action.icon }}</mat-icon>
          {{ action.label }}
        </a>
      </div>
    </div>
  </div>

  <div class="w-1/2 flex flex-col justify-between bg-[#dcbc64] rounded-lg p-8">
    <h3 class="text-3xl font-bold text-teal-700">
      Apprenez-en plus sur notre équipe
    </h3>

    <div class="mt-8 self-end">
      <button
        class="bg-yellow-400 rounded-full px-8 py-3 font-bold text-teal-700 hover:bg-yellow-500 flex items-center gap-2"
      >
        VOIR TOUT
        <mat-icon class="text-red-500 text-sm">chevron_right</mat-icon>
      </button>
    </div>
  </div>
</div>
